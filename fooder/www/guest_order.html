{% extends "templates/web.html" %}

{% block page_content %}
<div class="container" style="max-width: 720px;">
  <h3 id="title">Menu</h3>

  <div id="confirmation" style="display:none; margin-bottom:16px;"></div>

  <div id="order-form">
    <div style="margin-bottom: 12px;">
      <button class="btn btn-default" onclick="setLang('en')">English</button>
      <button class="btn btn-default" onclick="setLang('sw')">Swahili</button>
    </div>

    <div id="menu"></div>

    <hr/>
    <h4>Cart</h4>
    <div id="cart"></div>

    <div style="margin-top: 10px;">
      <textarea id="notes" class="form-control" placeholder="Notes (e.g., no onions)"></textarea>
    </div>

    <div style="margin-top: 10px;">
      <button class="btn btn-primary" onclick="placeOrder()">Place Order</button>
    </div>

    <div id="result" style="margin-top: 12px;"></div>
  </div>
</div>

<script>
const TOKEN = "{{ token }}";
let LANG = localStorage.getItem("guest_lang") || "en";
let MENU = [];
let CART = {};
let CURRENT_ORDER = null;
const STORAGE_KEY = `guest_order_${TOKEN}_last`;

function setLang(lang){
  LANG = lang;
  localStorage.setItem("guest_lang", lang);
  loadMenu();
}

function getSavedOrder(){
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
  } catch (e) {
    return null;
  }
}

function saveOrder(data){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data || {}));
}

function money(n){ return (Number(n||0)).toFixed(2); }

async function call(method, args){
  const r = await fetch("/api/method/" + method, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(args || {})
  });
  return await r.json();
}

function renderMenu(){
  const el = document.getElementById("menu");
  el.innerHTML = "";
  MENU.forEach(row => {
    const wrap = document.createElement("div");
    wrap.style.border = "1px solid #eee";
    wrap.style.padding = "10px";
    wrap.style.marginBottom = "8px";

    wrap.innerHTML = `
      <div style="display:flex;justify-content:space-between;gap:10px;">
        <div>
          <div style="font-weight:600;">${row.display_name}</div>
          <div style="opacity:.8;">${row.description || ""}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-weight:600;">${money(row.rate)}</div>
          <button class="btn btn-sm btn-default" onclick="addToCart('${row.item_code}')">Add</button>
        </div>
      </div>
    `;
    el.appendChild(wrap);
  });
}

function renderCart(){
  const el = document.getElementById("cart");
  const items = Object.values(CART);
  if(!items.length){ el.innerHTML = "<div>Cart is empty</div>"; return; }

  let total = 0;
  el.innerHTML = items.map(it => {
    total += it.qty * it.rate;
    return `
      <div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0;">
        <div>${it.name}</div>
        <div>
          <button class="btn btn-xs btn-default" onclick="chg('${it.item_code}',-1)">-</button>
          <span style="padding:0 10px;">${it.qty}</span>
          <button class="btn btn-xs btn-default" onclick="chg('${it.item_code}',1)">+</button>
        </div>
      </div>
    `;
  }).join("") + `<div style="font-weight:700;margin-top:8px;">Total: ${money(total)}</div>`;
}

function addToCart(item_code){
  const row = MENU.find(x => x.item_code === item_code);
  if(!row) return;
  if(!CART[item_code]){
    CART[item_code] = { item_code, qty: 0, rate: row.rate, name: row.display_name };
  }
  CART[item_code].qty += 1;
  renderCart();
}

function chg(item_code, delta){
  if(!CART[item_code]) return;
  CART[item_code].qty += delta;
  if(CART[item_code].qty <= 0) delete CART[item_code];
  renderCart();
}

function formatDate(value){
  try {
    return new Date(value).toLocaleString();
  } catch (e) {
    return value;
  }
}

function renderConfirmation(order){
  CURRENT_ORDER = order;
  const orderForm = document.getElementById("order-form");
  const confirmation = document.getElementById("confirmation");
  const hasTotal = order.total !== undefined && order.total !== null;

  const items = (order.items || []).map(it => `
    <div style="display:flex;justify-content:space-between;margin:4px 0;">
      <div>${it.item_code}${it.notes ? ` - ${it.notes}` : ""}</div>
      <div>Qty: ${it.qty}</div>
    </div>
  `).join("") || "<div>No items</div>";

  confirmation.innerHTML = `
    <div class="panel panel-success">
      <div class="panel-heading" style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
        <div>
          <div style="font-size:16px;font-weight:700;">Order Confirmation</div>
          <div style="opacity:.8;">Order #${order.order_number}</div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="openTracking()">Track Order</button>
      </div>
      <div class="panel-body">
        <div><strong>Restaurant:</strong> ${order.restaurant}</div>
        <div><strong>Table:</strong> ${order.table_label || order.restaurant_table}</div>
        <div><strong>Created:</strong> ${formatDate(order.created_on)}</div>
        <div><strong>Notes:</strong> ${order.notes || "None"}</div>
        <hr/>
        <div><strong>Items</strong></div>
        ${items}
        ${hasTotal ? `<div style="font-weight:700;margin-top:8px;">Total: ${money(order.total)}</div>` : ""}
      </div>
    </div>
  `;

  confirmation.style.display = "block";
  if(orderForm){ orderForm.style.display = "none"; }
}

async function loadMenu(){
  const res = await call("fooder.fooder.api.get_menu", { token: TOKEN, lang: LANG });
  if(res.message?.status !== "success"){
    document.getElementById("menu").innerHTML = `<div class="alert alert-warning">${res.message?.message || "Failed to load menu"}</div>`;
    return;
  }
  document.getElementById("title").innerText = `${res.message.data.restaurant} - Table ${res.message.data.table}`;
  MENU = res.message.data.items || [];
  renderMenu();
  renderCart();
}

async function placeOrder(){
  const items = Object.values(CART).map(it => ({ item_code: it.item_code, qty: it.qty }));
  if(!items.length){
    document.getElementById("result").innerHTML = `<div class="alert alert-info">Cart is empty</div>`;
    return;
  }
  const saved = getSavedOrder() || {};
  const client_order_id = saved.client_order_id || (crypto?.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
  const notes = document.getElementById("notes").value;

  // Persist client_order_id to avoid duplicate submissions on refresh
  saveOrder({ client_order_id });

  const res = await call("fooder.fooder.api.place_order", {
    token: TOKEN, lang: LANG, client_order_id, notes, items
  });

  if(res.message?.status === "success"){
    CART = {};
    renderCart();
    saveOrder({ client_order_id, tracking_token: res.message.data.tracking_token });
    renderConfirmation(res.message.data);
  } else {
    document.getElementById("result").innerHTML =
      `<div class="alert alert-danger">${res.message?.message || "Failed to place order"}</div>`;
  }
}

async function resumeOrder(){
  const saved = getSavedOrder();
  if(saved?.tracking_token){
    const res = await call("fooder.fooder.api.get_order", { tracking_token: saved.tracking_token });
    if(res.message?.status === "success"){
      renderConfirmation(res.message.data);
      return;
    }
  }
  loadMenu();
}

function openTracking(){
  if(!CURRENT_ORDER) return;
  window.location.href = `/track/${encodeURIComponent(CURRENT_ORDER.tracking_token)}`;
}

resumeOrder();
</script>
{% endblock %}
