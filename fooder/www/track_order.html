{% extends "templates/web.html" %}

{% block page_content %}
<div class="container" style="max-width: 760px;">
  <h3>Track Order</h3>
  <div id="content" class="well">Loading...</div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const CONTEXT_TOKEN = "{{ tracking_token or '' }}";
const TRACKING_TOKEN = CONTEXT_TOKEN || params.get("tracking_token");
const POLL_MS = ({{ polling_seconds }} || 10) * 1000;
let ORDER = null;
let pollTimer = null;

function money(n){ return (Number(n||0)).toFixed(2); }

async function call(method, args){
  const r = await fetch("/api/method/" + method, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(args || {})
  });
  return await r.json();
}

function formatDate(value){
  try {
    return new Date(value).toLocaleString();
  } catch (e) {
    return value;
  }
}

function renderTimeline(order) {
  const log = order.status_log || [];
  const logMap = log.reduce((acc, row) => {
    if (!acc[row.to]) acc[row.to] = row;
    return acc;
  }, {});

  const statuses = ["Placed", "Accepted", "Preparing", "Ready", "Served"];
  if ((order.status === "Cancelled" || logMap["Cancelled"]) && !statuses.includes("Cancelled")) {
    statuses.push("Cancelled");
  }

  return statuses.map((status, idx) => {
    const row = logMap[status];
    const isActive = order.status === status;
    const isComplete = Boolean(row) || statuses.indexOf(order.status) > idx;
    const badgeClass = status === "Cancelled" ? "label-danger" : isActive ? "label-primary" : "label-default";

    return `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #eee;">
        <div>
          <span class="label ${badgeClass}" style="margin-right:6px;">${status}</span>
          ${row ? `<span style="opacity:.85;">${formatDate(row.changed_on)}</span>` : `<span style="opacity:.6;">Pending</span>`}
        </div>
        ${isActive ? `<span style="font-weight:600;">Current</span>` : isComplete ? `<span style="opacity:.6;">Done</span>` : ""}
      </div>
    `;
  }).join("");
}

function render(order){
  ORDER = order;
  const content = document.getElementById("content");
  const hasTotal = order && order.total !== undefined && order.total !== null;
  if(!order){
    content.innerHTML = `<div class="alert alert-warning">Order not found.</div>`;
    return;
  }

  const items = (order.items || []).map(it => `
    <div style="display:flex;justify-content:space-between;margin:4px 0;">
      <div>${it.item_code}${it.notes ? ` - ${it.notes}` : ""}</div>
      <div>Qty: ${it.qty}</div>
    </div>
  `).join("") || "<div>No items</div>";

  const statusLog = (order.status_log || []).map(row => `
    <div style="padding:6px 0;border-bottom:1px solid #eee;">
      <div style="font-weight:600;">${row.to}</div>
      <div style="opacity:.8;">${formatDate(row.changed_on)}</div>
      ${row.note ? `<div>${row.note}</div>` : ""}
    </div>
  `).join("") || "<div>No updates yet.</div>";

  content.innerHTML = `
    <div class="panel panel-default">
      <div class="panel-heading" style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
        <div>
          <div style="font-size:16px;font-weight:700;">Order #${order.order_number}</div>
          <div style="opacity:.8;">Tracking ${order.tracking_code}</div>
        </div>
        <button class="btn btn-default btn-sm" onclick="refreshOrder()">Refresh</button>
      </div>
      <div class="panel-body">
        <div><strong>Status:</strong> ${order.status}</div>
        <div><strong>Restaurant:</strong> ${order.restaurant}</div>
        <div><strong>Table:</strong> ${order.table_label || order.restaurant_table}</div>
        <div><strong>Created:</strong> ${formatDate(order.created_on)}</div>
        <div><strong>Notes:</strong> ${order.notes || "None"}</div>
        ${hasTotal ? `<div style="margin-top:8px;font-weight:700;">Total: ${money(order.total)}</div>` : ""}
        <hr/>
        <div><strong>Status timeline</strong></div>
        ${renderTimeline(order)}
        <hr/>
        <div><strong>Items</strong></div>
        ${items}
        <hr/>
        <div><strong>Updates</strong></div>
        ${statusLog}
      </div>
    </div>
  `;
}

async function refreshOrder(){
  if(!TRACKING_TOKEN){
    document.getElementById("content").innerHTML = `<div class="alert alert-info">Missing tracking token.</div>`;
    return;
  }
  const res = await call("fooder.fooder.api.get_order", { tracking_token: TRACKING_TOKEN });
  if(res.message?.status === "success"){
    render(res.message.data);
  } else {
    render(null);
  }
}

function startPolling(){
  if(pollTimer){ clearInterval(pollTimer); }
  if(!TRACKING_TOKEN) return;
  pollTimer = setInterval(refreshOrder, POLL_MS);
}

refreshOrder();
startPolling();
</script>
{% endblock %}
